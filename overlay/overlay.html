<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narsil</title>
<!-- Edge shows it on the taskbar for the window. -->
<link rel="icon" type="image/png" sizes="256x256" href="/icon.png">
<style>
  :root { color-scheme: light dark; --bg: #F7F6FB; --bg2: #ECEAF5; --text: #1E1C2C; --dim: #6E6A85; --row: rgba(0,0,0,.04); --row-hover: rgba(0,0,0,.08);
          --working: #3B8BFF; --idle: #8A90A6; --waiting: #F5B400; --done: #22B573; --error: #F0435A; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16182A; --bg2: #202440; --text: #ECEBF3; --dim: #9A98AD; --row: rgba(255,255,255,.05); --row-hover: rgba(255,255,255,.1); }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 'Segoe UI', system-ui, sans-serif; overflow: hidden; user-select: none; }
  .card { position: relative; width: 100%; height: 100%; box-sizing: border-box; overflow: hidden; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px;
          background: radial-gradient(120% 70% at 50% 0%, var(--bg2) 0%, var(--bg) 70%); }
  /* Long text wraps or is cut inside the window, never widens it. */
  .card > *, .focus > * { min-width: 0; max-width: 100%; box-sizing: border-box; }
  .clamp { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .event { display: none; padding: 6px 30px 6px 10px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 22%, transparent);
           border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); font-weight: 600; cursor: pointer; }
  .event small { display: block; font-weight: 400; color: var(--text); opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .has-event .event { display: block; animation: drop .35s ease-out; }
  .close { position: absolute; top: 12px; right: 16px; width: 22px; height: 22px; border: 0; border-radius: 6px; background: transparent; color: var(--text); opacity: .6; font-size: 16px; cursor: pointer; display: none; }
  .has-event .close { display: block; }
  .close:hover { opacity: 1; background: var(--row-hover); }
  .focus { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; border-radius: 10px; padding: 2px 0 4px; }
  .focus:hover { background: var(--row); }
  #sprite, #sprite svg { width: 168px; height: 150px; }
  .has-event #sprite, .has-event #sprite svg, .has-tip #sprite, .has-tip #sprite svg { width: 120px; height: 107px; }
  .status { font-weight: 800; letter-spacing: .6px; font-size: 12px; color: var(--accent); display: flex; align-items: center; gap: 6px; }
  .status::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .s-working .status::before { animation: blink 1s ease-in-out infinite; }
  .headline { font-weight: 600; text-align: center; -webkit-line-clamp: 2; }
  .line { font-size: 12px; color: var(--dim); text-align: center; -webkit-line-clamp: 1; }
  .tip { display: none; -webkit-line-clamp: 4; position: relative; overflow: visible; margin-top: 6px; padding: 5px 9px; border-radius: 10px; background: var(--row-hover); font-size: 12px; text-align: center; }
  .tip.shown { display: -webkit-box; }
  .tip::before { content: ''; position: absolute; top: -6px; left: 50%; margin-left: -6px; border: 6px solid transparent; border-top: 0; border-bottom-color: var(--row-hover); }
  .usage { display: flex; flex-direction: column; gap: 3px; font-size: 11px; }
  .meter { display: grid; grid-template-columns: 56px minmax(0, 1fr) 38px; align-items: center; gap: 6px; }
  .meter .label { color: var(--dim); }
  .meter .track { height: 7px; border-radius: 4px; background: var(--row-hover); overflow: hidden; }
  .meter .fill { height: 100%; border-radius: 4px; transition: width .6s ease-out; }
  .meter .pct { font-weight: 700; text-align: right; }
  .summary { font-size: 11px; color: var(--dim); text-align: center; }
  .agents { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: 6px; }
  .agents:empty { display: none; }
  .agent { max-width: 100%; padding: 2px 8px; border-radius: 9px; background: var(--row); color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cache { font-size: 11px; color: var(--dim); text-align: center; }
  .cache:empty { display: none; }
  .steps { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; font-size: 11px; }
  .steps:empty { display: none; }
  .step { padding: 3px 8px; border-radius: 8px; background: var(--row); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step::before { content: "➜ "; color: var(--dim); }
  .list { display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 7px; padding: 4px 8px; border-radius: 7px; background: var(--row); cursor: pointer; }
  .row:hover { background: var(--row-hover); }
  .row .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .name small { color: var(--dim); margin-left: 4px; }
  .row .tag { font-size: 10px; font-weight: 800; letter-spacing: .4px; color: var(--accent); }
  .s-working { --accent: var(--working); } .s-idle { --accent: var(--idle); } .s-waiting { --accent: var(--waiting); }
  .s-done { --accent: var(--done); } .s-error { --accent: var(--error); }
  .k-done { --accent: var(--done); } .k-question { --accent: var(--waiting); } .k-error { --accent: var(--error); }
  @keyframes drop { from { transform: translateY(-6px); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes blink { 50% { opacity: .3 } }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="event" id="event" title="Abrir la conversación"><span id="event-title"></span><small id="event-text"></small></div>
  <button class="close" id="close" title="Descartar">×</button>
  <div class="focus" id="focus" title="Abrir la conversación">
    <div id="sprite"></div>
    <div class="status" id="status">…</div>
    <div class="headline clamp" id="headline">Narsil se está despertando…</div>
    <div class="line clamp" id="line"></div>
    <div class="tip clamp" id="tip" title="Consejo de Narsil"></div>
    <div class="agents" id="agents"></div>
    <div class="cache" id="cache"></div>
    <div class="steps" id="steps" title="Próximos pasos: vuelve a la conversación para elegir uno"></div>
  </div>
  <div class="usage" id="usage"></div>
  <div class="summary" id="summary"></div>
  <div class="list" id="list"></div>
</div>
<script>
  const $ = id => document.getElementById(id)
  const LABEL = { working: 'TRABAJANDO', idle: 'PARADA', waiting: 'TE NECESITA', done: 'TERMINADA', error: 'ERROR' }
  // A count agrees in number: "1 parada", "2 paradas", "2 te necesitan".
  const COUNT = {
    working: ['trabajando', 'trabajando'],
    idle: ['parada', 'paradas'],
    waiting: ['te necesita', 'te necesitan'],
    done: ['terminada', 'terminadas'],
    error: ['con error', 'con error'],
  }
  const ORDER = ['working', 'waiting', 'error', 'done', 'idle']
  let shownSvg = null
  let focusId = null

  // How much the focused conversation has spent: context, 5 hours, week.
  function drawUsage(rows) {
    $('usage').replaceChildren(
      ...rows.map(r => {
        const row = document.createElement('div')
        row.className = 'meter'
        row.title = r.note || ''
        row.innerHTML = '<span class="label"></span><span class="track"><span class="fill"></span></span><span class="pct"></span>'
        row.querySelector('.label').textContent = r.label
        const fill = row.querySelector('.fill')
        fill.style.display = 'block'
        fill.style.width = Math.max(0, Math.min(100, r.percent)) + '%'
        fill.style.background = r.color
        row.querySelector('.pct').textContent = Math.round(r.percent) + ' %'
        row.querySelector('.pct').style.color = r.color
        return row
      }),
    )
  }

  const open = session => fetch('/open' + (session ? '?session=' + encodeURIComponent(session) : ''), { method: 'POST' })

  function render({ sessions, summary, event }) {
    // The conversation an event is about comes first; else whoever needs you most.
    const focus = (event && sessions.find(s => s.sessionId === event.sessionId)) || sessions[0]
    focusId = focus ? focus.sessionId : null
    if (focus) {
      // Replace the drawing only when it changes, so its animation runs on.
      if (focus.svg !== shownSvg) {
        $('sprite').innerHTML = focus.svg
        shownSvg = focus.svg
      }
      $('focus').className = 'focus s-' + focus.status
      $('status').textContent = LABEL[focus.status] + (summary.total > 1 ? ' · ' + focus.title : '')
      $('headline').textContent = focus.headline
      $('headline').title = focus.headline
      $('line').textContent = focus.line
      // Narsil's tip, as a speech bubble under her.
      $('tip').textContent = focus.tip ? '💡 ' + focus.tip : ''
      $('tip').className = 'tip clamp' + (focus.tip ? ' shown' : '')
      $('tip').title = focus.tip || ''
      // A small serpent per running subagent, with its task.
      $('agents').replaceChildren(
        ...(focus.agents || []).map(task => {
          const chip = document.createElement('span')
          chip.className = 'agent'
          chip.textContent = '🐍 ' + task
          chip.title = task
          return chip
        }),
      )
      // The prompt cache's clock, and the next steps Narsil offers.
      $('cache').textContent = focus.cache || ''
      $('steps').replaceChildren(
        ...(focus.steps || []).map(text => {
          const step = document.createElement('div')
          step.className = 'step'
          step.textContent = text
          return step
        }),
      )
      drawUsage(focus.usage || [])
    }
    $('card').className = 'card' + (event ? ' has-event' : '') + (focus && focus.tip ? ' has-tip' : '')
    $('event').className = 'event' + (event ? ' k-' + event.kind : '')
    $('event-title').textContent = event ? event.title : ''
    $('event-text').textContent = event ? event.text : ''

    const counted = ORDER.filter(s => summary[s] > 0).map(s => summary[s] + ' ' + COUNT[s][summary[s] === 1 ? 0 : 1])
    $('summary').textContent = summary.total > 1 ? summary.total + ' conversaciones: ' + counted.join(' · ') : ''

    $('list').replaceChildren(
      ...sessions
        .filter(s => s.sessionId !== focusId)
        .slice(0, 4)
        .map(s => {
          const row = document.createElement('div')
          row.className = 'row s-' + s.status
          row.title = s.headline
          row.innerHTML = '<span class="dot"></span><span class="name"></span><span class="tag"></span>'
          row.querySelector('.name').textContent = s.title
          const small = document.createElement('small')
          small.textContent = s.headline
          row.querySelector('.name').append(small)
          row.querySelector('.tag').textContent = LABEL[s.status]
          row.addEventListener('click', () => open(s.sessionId))
          return row
        }),
    )
  }

  new EventSource('/events').onmessage = message => render(JSON.parse(message.data))
  $('focus').addEventListener('click', () => open(focusId))
  $('event').addEventListener('click', () => open(null))
  $('close').addEventListener('click', click => {
    click.stopPropagation()
    fetch('/dismiss', { method: 'POST' })
  })
</script>
</body>
</html>
