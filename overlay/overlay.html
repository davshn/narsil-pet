<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narsil</title>
<!-- The server puts its key here: the page's actions carry it. -->
<meta name="narsil-key" content="__NARSIL_KEY__">
<!-- Edge shows it on the taskbar for the window. -->
<link rel="icon" type="image/png" sizes="256x256" href="/icon.png">
<style>
  :root { color-scheme: light dark; --bg: #F7F6FB; --bg2: #ECEAF5; --text: #1E1C2C; --dim: #6E6A85; --row: rgba(0,0,0,.04); --row-hover: rgba(0,0,0,.08);
          --working: #3B8BFF; --idle: #8A90A6; --waiting: #F5B400; --done: #22B573; --error: #F0435A; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16182A; --bg2: #202440; --text: #ECEBF3; --dim: #9A98AD; --row: rgba(255,255,255,.05); --row-hover: rgba(255,255,255,.1); }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 'Segoe UI', system-ui, sans-serif; overflow: hidden; user-select: none; }
  .card { position: relative; width: 100%; height: 100%; box-sizing: border-box; overflow: hidden; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px;
          background: radial-gradient(120% 70% at 50% 0%, var(--bg2) 0%, var(--bg) 70%); }
  /* Long text wraps or is cut inside the window, never widens it. */
  .card > *, .focus > * { min-width: 0; max-width: 100%; box-sizing: border-box; }
  .clamp { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .event { display: none; padding: 6px 30px 6px 10px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 22%, transparent);
           border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); font-weight: 600; cursor: pointer; }
  .event small { display: block; font-weight: 400; color: var(--text); opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .has-event .event { display: block; animation: drop .35s ease-out; }
  .close { position: absolute; top: 12px; right: 16px; width: 22px; height: 22px; border: 0; border-radius: 6px; background: transparent; color: var(--text); opacity: .6; font-size: 16px; cursor: pointer; display: none; }
  .has-event .close { display: block; }
  .close:hover { opacity: 1; background: var(--row-hover); }
  .focus { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; border-radius: 10px; padding: 2px 0 4px; }
  .focus:hover { background: var(--row); }
  #sprite, #sprite svg { width: 120px; height: 107px; }
  .has-event #sprite, .has-event #sprite svg, .has-tip #sprite, .has-tip #sprite svg { width: 96px; height: 86px; }
  .status { font-weight: 800; letter-spacing: .6px; font-size: 12px; color: var(--accent); display: flex; align-items: center; gap: 6px; }
  .status::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .s-working .status::before { animation: blink 1s ease-in-out infinite; }
  .headline { font-weight: 600; text-align: center; -webkit-line-clamp: 2; }
  .line { font-size: 12px; color: var(--dim); text-align: center; -webkit-line-clamp: 2; }
  .line:empty { display: none; }
  .tip { display: none; -webkit-line-clamp: 4; position: relative; overflow: visible; margin-top: 6px; padding: 5px 9px; border-radius: 10px; background: var(--row-hover); font-size: 12px; text-align: center; }
  .tip.shown { display: -webkit-box; }
  .tip::before { content: ''; position: absolute; top: -6px; left: 50%; margin-left: -6px; border: 6px solid transparent; border-top: 0; border-bottom-color: var(--row-hover); }
  .xp { font-size: 11px; color: var(--dim); text-align: center; }
  .xp:empty { display: none; }
  /* The account's limits, once. */
  .usage { flex-shrink: 0; display: flex; flex-direction: column; gap: 3px; font-size: 11px; }
  .meter { display: grid; grid-template-columns: 56px minmax(0, 1fr) 38px; align-items: center; gap: 6px; }
  .meter .label { color: var(--dim); }
  .bar { height: 6px; border-radius: 3px; background: var(--row-hover); overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 3px; transition: width .6s ease-out; }
  .pct { font-weight: 700; text-align: right; }
  /* Every open conversation; scrolls when there are many. */
  .list { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 3px; overflow-y: auto; }
  .conv { flex-shrink: 0; border-radius: 7px; background: var(--row); }
  .row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; column-gap: 7px; row-gap: 3px; padding: 4px 8px; border-radius: 7px; cursor: pointer; }
  .row:hover { background: var(--row-hover); }
  .row .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .name small { color: var(--dim); margin-left: 4px; }
  .row .tag { font-size: 10px; font-weight: 800; letter-spacing: .4px; color: var(--accent); }
  .row .fill { grid-column: 2 / 4; display: grid; grid-template-columns: minmax(0, 1fr) 34px; align-items: center; gap: 6px; font-size: 10px; }
  .more { display: none; flex-direction: column; gap: 4px; padding: 2px 10px 8px 25px; font-size: 11px; }
  .conv.open .more { display: flex; }
  /* Opened, the context shows below with its word: not twice. */
  .conv.open .row .fill { display: none; }
  .ctx { display: grid; grid-template-columns: auto minmax(0, 1fr) 34px; align-items: center; gap: 6px; }
  .word { border: 0; padding: 0; background: none; color: var(--text); font: inherit; font-weight: 700; text-decoration: underline dotted; cursor: pointer; }
  .note { color: var(--dim); }
  .note:empty { display: none; }
  .parts { display: flex; flex-direction: column; gap: 2px; }
  .part { display: grid; grid-template-columns: 104px minmax(0, 1fr) 34px; align-items: center; gap: 6px; }
  .part .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
  .task, .agent, .step { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task.completed { color: var(--dim); text-decoration: line-through; }
  .task.in_progress, .task.running { color: var(--working); }
  .step::before { content: "➜ "; color: var(--dim); }
  .go { align-self: flex-start; border: 0; border-radius: 6px; padding: 2px 8px; background: var(--row-hover); color: var(--text); font: inherit; cursor: pointer; }
  .s-working { --accent: var(--working); } .s-idle { --accent: var(--idle); } .s-waiting { --accent: var(--waiting); }
  .s-done { --accent: var(--done); } .s-error { --accent: var(--error); }
  .k-done { --accent: var(--done); } .k-question { --accent: var(--waiting); } .k-error { --accent: var(--error); }
  @keyframes drop { from { transform: translateY(-6px); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes blink { 50% { opacity: .3 } }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="event" id="event" title="Abrir la conversación"><span id="event-title"></span><small id="event-text"></small></div>
  <button class="close" id="close" title="Descartar">×</button>
  <div class="focus" id="focus" title="Abrir la conversación">
    <div id="sprite"></div>
    <div class="status" id="status">…</div>
    <div class="headline clamp" id="headline">Me estoy despertando…</div>
    <div class="line clamp" id="line"></div>
    <div class="tip clamp" id="tip" title="Consejo de Narsil"></div>
    <div class="xp" id="xp"></div>
  </div>
  <div class="usage" id="usage"></div>
  <div class="list" id="list"></div>
</div>
<script>
  const $ = id => document.getElementById(id)
  // Every action of the page goes with its key.
  const KEY = document.querySelector('meta[name="narsil-key"]').content
  const post = url => fetch(url, { method: 'POST', headers: { 'x-narsil-page': KEY } })
  const LABEL = { working: 'TRABAJANDO', idle: 'PARADA', waiting: 'TE NECESITA', done: 'TERMINADA', error: 'ERROR' }
  const TASK_ICON = { pending: '○', in_progress: '◐', completed: '●', running: '⟳' }
  let shownSvg = null
  let focusId = null
  // The conversation opened in the list, and whether its context's breakdown shows.
  let openId = null
  let isContextOpen = false
  let last = null

  const el = (tag, className, text) => {
    const node = document.createElement(tag)
    if (className) node.className = className
    if (text !== undefined) node.textContent = text
    return node
  }
  const levelColor = percent => (percent >= 85 ? 'var(--error)' : percent >= 60 ? 'var(--waiting)' : 'var(--done)')
  // A bar and its percent, in the given color.
  function bar(percent, color) {
    const track = el('span', 'bar')
    const fill = el('span')
    fill.style.width = Math.max(0, Math.min(100, percent)) + '%'
    fill.style.background = color
    track.append(fill)
    const pct = el('span', 'pct', Math.round(percent) + ' %')
    pct.style.color = color
    return [track, pct]
  }

  // The account's limits (5 hours, week): the same for every conversation.
  function drawUsage(rows) {
    $('usage').replaceChildren(
      ...rows.map(r => {
        const row = el('div', 'meter')
        row.title = r.note || ''
        row.append(el('span', 'label', r.label), ...bar(r.percent, r.color))
        return row
      }),
    )
  }

  const open = session => post('/open' + (session ? '?session=' + encodeURIComponent(session) : ''))

  // One conversation of the list: its state and context; opened, what fills
  // its context, its tasks, subagents, cache and next steps.
  function drawConversation(s) {
    const conv = el('div', 'conv s-' + s.status + (s.sessionId === openId ? ' open' : ''))
    const row = el('div', 'row')
    row.title = s.headline
    const name = el('span', 'name', s.title || 'conversación')
    name.append(el('small', '', s.headline))
    row.append(el('span', 'dot'), name, el('span', 'tag', LABEL[s.status]))
    if (s.context) {
      const fill = el('span', 'fill')
      fill.append(...bar(s.context.percent, levelColor(s.context.percent)))
      row.append(fill)
    }
    row.addEventListener('click', () => {
      openId = openId === s.sessionId ? null : s.sessionId
      isContextOpen = false
      if (last) render(last)
    })
    const more = el('div', 'more')
    if (s.context) {
      const ctx = el('div', 'ctx')
      const word = el('button', 'word', 'Contexto')
      word.title = 'Ver cómo se llena el contexto'
      word.addEventListener('click', () => {
        isContextOpen = !isContextOpen
        if (last) render(last)
      })
      ctx.append(word, ...bar(s.context.percent, levelColor(s.context.percent)))
      more.append(ctx, el('span', 'note', s.context.note || ''))
      const detail = s.contextDetail
      if (isContextOpen && detail && Array.isArray(detail.parts)) {
        const parts = el('div', 'parts')
        const room = Math.max(1, detail.window)
        for (const p of detail.parts) {
          const part = el('div', 'part')
          part.append(el('span', 'label', p.name), ...bar((p.tokens / room) * 100, p.color))
          parts.append(part)
        }
        more.append(parts)
      }
    }
    for (const t of s.tasks || []) more.append(el('div', 'task ' + t.status, TASK_ICON[t.status] + ' ' + t.text))
    for (const agent of s.agents || []) {
      const chip = el('div', 'agent', agent.text)
      chip.style.color = agent.color
      more.append(chip)
    }
    if (s.cache) more.append(el('div', 'note', s.cache))
    for (const text of s.steps || []) more.append(el('div', 'step', text))
    const go = el('button', 'go', 'Abrir la conversación')
    go.addEventListener('click', () => open(s.sessionId))
    more.append(go)
    conv.append(row, more)
    return conv
  }

  function render(state) {
    last = state
    const { sessions, event } = state
    // Narsil wears the conversation an event is about; else the most important.
    const focus = (event && sessions.find(s => s.sessionId === event.sessionId)) || sessions[0]
    focusId = focus ? focus.sessionId : null
    if (focus) {
      // Replace the drawing only when it changes, so its animation runs on.
      if (focus.svg !== shownSvg) {
        $('sprite').innerHTML = focus.svg || ''
        shownSvg = focus.svg
      }
      $('focus').className = 'focus s-' + focus.status
      $('status').textContent = LABEL[focus.status] + (focus.model ? ' · ' + focus.model : '') + (sessions.length > 1 ? ' · ' + focus.title : '')
      $('headline').textContent = focus.headline
      $('headline').title = focus.headline
      $('line').textContent = focus.line || ''
      // Narsil's tip, as a speech bubble under her.
      $('tip').textContent = focus.tip ? '💡 ' + focus.tip : ''
      $('tip').className = 'tip clamp' + (focus.tip ? ' shown' : '')
      $('tip').title = focus.tip || ''
      $('xp').textContent = focus.xp || ''
      drawUsage((focus.usage || []).filter(r => r.key !== 'context'))
    }
    $('card').className = 'card' + (event ? ' has-event' : '') + (focus && focus.tip ? ' has-tip' : '')
    $('event').className = 'event' + (event ? ' k-' + event.kind : '')
    $('event-title').textContent = event ? event.title : ''
    $('event-text').textContent = event ? event.text : ''

    // Keep the list's scroll where you left it.
    const list = $('list')
    const scrolled = list.scrollTop
    list.replaceChildren(...sessions.map(drawConversation))
    list.scrollTop = scrolled
  }

  // Only the newest state is drawn, once per frame. A hidden window gets no
  // frames, so the messages it piled up while hidden show as one, the latest,
  // instead of replaying one after another when it shows again.
  let pending = null
  new EventSource('/events').onmessage = message => {
    const isQueued = pending !== null
    pending = message.data
    if (isQueued) return
    requestAnimationFrame(() => {
      const data = pending
      pending = null
      render(JSON.parse(data))
    })
  }
  // Where this window is, for the tip window to open above it (macOS).
  function reportBounds() {
    const q = 'x=' + screenX + '&y=' + screenY + '&w=' + outerWidth + '&h=' + outerHeight + '&visible=' + (document.visibilityState === 'visible' ? 1 : 0)
    post('/bounds?' + q).catch(() => undefined)
  }
  reportBounds()
  setInterval(reportBounds, 2000)
  addEventListener('resize', reportBounds)
  document.addEventListener('visibilitychange', reportBounds)
  $('focus').addEventListener('click', () => open(focusId))
  $('event').addEventListener('click', () => open(null))
  $('close').addEventListener('click', click => {
    click.stopPropagation()
    post('/dismiss')
  })
</script>
</body>
</html>
